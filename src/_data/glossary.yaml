# Cadet terms explained on the Parents & Cadets page. Add more any time.
- term: ACR
  meaning: Annual Ceremonial Review – the big year-end parade where cadets are inspected by a guest Reviewing Officer and awards are presented.
- term: ACL
  meaning: Air Cadet League of Canada – the civilian partner of the Air Cadet program that supports squadrons and runs the post-secondary and flying scholarships.
- term: C1 (Blue Dress Uniform)
  meaning: The blue uniform worn for parades and ceremonies such as the CO’s Parade and Remembrance Day.
- term: C3
  meaning: The blue uniform – see the “Blue Uniform – C3” dress guide on the Supply page for how to wear it.
- term: C5 / FTU
  meaning: Field Training Uniform – the training uniform worn on most regular training nights and on field exercises. See the “Training Uniform – C5” guide on the Supply page.
- term: Cadet365
  meaning: The cadet’s Microsoft 365 account. It includes email, Microsoft Teams and other resources, and is where most squadron correspondence happens.
- term: CIC
  meaning: Cadet Instructors Cadre – the officers specifically trained to work with cadets who lead and supervise training.
- term: CO
  meaning: Commanding Officer – the officer in charge of the squadron.
- term: CO’s Parade
  meaning: A formal parade night with the Commanding Officer. Cadets wear their C1 Blue Dress Uniform (or FTU if they don’t have it yet).
- term: DND
  meaning: Department of National Defence – it runs the cadet program together with the Air Cadet League and strictly controls all flying activities.
- term: Fam flying / gliding
  meaning: Familiarization flights – short flights in a powered aircraft or glider where cadets get to try the controls.
- term: FTX
  meaning: Field Training Exercise – a weekend of outdoor training from Friday evening to Sunday afternoon.
- term: Ground school
  meaning: Aviation theory course for level 3 cadets and up applying for the Glider Pilot or Power Pilot training course.
- term: HMCS Nonsuch
  meaning: The building at 11807 Kingsway NW where 395 Squadron has trained since 1962.
- term: Level
  meaning: Cadets progress through training levels each year. Your Level Officer is the staff member responsible for your level – ask them about dress and training questions.
- term: LSTF
  meaning: Lord Strathcona Trust Fund – supports cadet physical and citizenship training, including the zone drill and sports competitions and the Lord Strathcona Medal.
- term: Mess dinner
  meaning: A formal dinner held in military tradition. Tickets are sold in advance.
- term: PAMRA
  meaning: Parents’ Association Meritorious Remuneration Award – a $500 award for cadets enrolled in post-secondary studies.
- term: Parade night
  meaning: The weekly training night that all cadets attend – Tuesdays at HMCS Nonsuch.
- term: “Per ardua ad astra”
  meaning: “Through adversity to the stars” – the motto of the Royal Canadian Air Force.
- term: RCACS
  meaning: Royal Canadian Air Cadet Squadron.
- term: SSC
  meaning: Squadron Sponsoring Committee – the parents and volunteers who support the squadron, including fundraising such as bingo.
- term: Stand down
  meaning: A break in the training year (for example over the holidays) when there is no training.
- term: “Succeed as One”
  meaning: The squadron’s slogan – it appears on the 395 challenge coin.
- term: Teams
  meaning: Microsoft Teams (part of Cadet365) – sign-up sheets, kit lists and many activity details are posted here.
