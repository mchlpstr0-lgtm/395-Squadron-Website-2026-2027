- title: Remembrance Day Parade – All Cadets (Mandatory)
  date: 2026-11-11
  start: "09:00"
  end: "11:45"
  location: maranatha
  category: ceremonial
  who: All cadets to attend.
  dress: C1 Blue Dress Uniform. For those who only have FTU – please wear them. Cadets are encouraged to wear a jacket and black gloves with their uniform. If you have the cadet parka please wear it.
  notes:
    - Arrive at 9:00 am at Maranatha Christian Reformed Church (11905 47 St NW).
    - The non-denominational service begins at 9:30 am.
    - 10:00–10:15 am – form up on the road outside the church.
    - Cadets will march from the church to the Beverly Cenotaph.
    - Pick up from the Beverly Cenotaph (4001 118 Ave NW) at approx. 11:45 am.

