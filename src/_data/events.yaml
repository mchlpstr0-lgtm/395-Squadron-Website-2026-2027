# =====================================================================
#  395 SQUADRON CALENDAR
#  Every event here appears on the Calendar page, the "Coming up" list on
#  the home page, the calendar subscription feed (/calendar.ics) and in any
#  announcement that uses {% monthSchedule "YYYY-MM" %}.
#
#  HOW TO ADD AN EVENT – copy a block below and change it:
#
#  - title: Regular Training Night – All Cadets
#    date: 2026-12-01          # YYYY-MM-DD
#    start: "18:15"            # 24-hour time in quotes. Leave out start/end for an all-day item.
#    end: "21:15"
#    endDate: 2026-12-03       # optional – only for events that span several days
#    location: nonsuch         # a key from locations.yaml, or any text, e.g. "Kinsmen Sports Centre"
#    category: training        # a key from categories.yaml
#    who: All cadets to attend
#    dress: FTU
#    bring: Water bottle
#    notes:                    # optional extra bullet points
#      - Anything else people need to know.
#    link: { text: More information, url: "https://example.com" }   # optional
#    cancelled: true           # optional – shows the event struck through as CANCELLED
#
#  Keep events in date order to make the file easy to read (the site sorts them anyway).
# =====================================================================

